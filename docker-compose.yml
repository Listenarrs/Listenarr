version: '3.8'

services:
  listenarr:
    image: ghcr.io/listenarrs/listenarr:canary ## For Docker Hub, replace the image with docker.io/therobbiedavis/listenarr:canary
    ports:
      - "4545:4545"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # OPTIONAL: set logging level at runtime (overrides config file). Valid values: Verbose, Debug, Information, Warning, Error, Fatal
      # e.g. to enable debug or trace logs in Docker: LISTENARR_LOG_LEVEL=Debug or LISTENARR_LOG_LEVEL=Trace
      - LISTENARR_LOG_LEVEL=Information
      - LISTENARR_PUBLIC_URL=https://your-domain.com ## OPTIONAL: Used by Discord Bot
    volumes:
      - listenarr_data:/app/config
    restart: unless-stopped

volumes:
  listenarr_data:
