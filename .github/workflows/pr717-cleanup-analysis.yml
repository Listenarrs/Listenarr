name: PR 717 cleanup analysis

on:
  push:
    branches:
      - bugfix/unix-folder-name-space

permissions:
  contents: write

jobs:
  inventory-ownership-compatibility:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory ownership protocol compatibility
        shell: bash
        run: |
          set -euo pipefail
          for token in \
            'LegacyMarkerPayload' \
            'MatchesLegacyPayload' \
            'UpgradeLegacyMarkerAsync' \
            'UpgradeLegacyAsync' \
            'UpgradeLegacyRecordAsync' \
            'DirectoryObjectIdentityVersion == 1' \
            'DirectoryObjectIdentityVersion is null' \
            'MarkerPayload' \
            'TryRetireMatchingMarkerIfPresent' \
            'PublishMigrationTargetAsync' \
            'RecoverMigrationTargetPromotion' \
            'migration.tmp'; do
            echo "=== $token ==="
            git grep -n -F "$token" -- listenarr.application listenarr.domain listenarr.infrastructure listenarr.api tests || true
          done
          echo '=== ownership store files ==='
          find listenarr.infrastructure/Library/Moving -maxdepth 1 -type f -name '*Ownership*' -printf '%f\n' | sort
          echo '=== claim marker calls ==='
          git grep -n -E 'PinnedLibraryDirectoryOwnershipMarker\.(EnsureAsync|ReconcileAsync|PublishMigrationTargetAsync|UpgradeLegacyAsync|TryRetireMatchingMarkerIfPresent)' -- listenarr.infrastructure tests || true
          echo '=== marker API calls ==='
          git grep -n -E 'LibraryDirectoryOwnershipMarker\.(EnsureAsync|Validate|Delete|Contains|HasValid|SerializePayload|Matches)' -- listenarr.infrastructure tests || true
