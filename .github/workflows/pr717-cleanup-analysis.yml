name: PR 717 cleanup analysis

on:
  push:
    branches:
      - bugfix/unix-folder-name-space

permissions:
  contents: write

jobs:
  inventory-root-enrollment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory obsolete root enrollment compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ManagedDirectoryEnrollment references ==='
          git grep -n -F 'ManagedDirectoryEnrollment' -- ':!.github/workflows/pr717-cleanup-analysis.yml' ':!.github/scripts/**' || true
          echo '=== marker literal references ==='
          git grep -n -F '.listenarr-root-enrollment.json' -- ':!.github/workflows/pr717-cleanup-analysis.yml' ':!.github/scripts/**' || true
          echo '=== source file ==='
          sed -n '1,240p' listenarr.infrastructure/FileSystem/ManagedDirectoryEnrollment.cs
