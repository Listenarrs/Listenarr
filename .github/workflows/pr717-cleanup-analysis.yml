name: PR 717 cleanup analysis

on:
  push:
    branches:
      - bugfix/unix-folder-name-space

permissions:
  contents: write

jobs:
  codify-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Codify compatibility and migration policy
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/policy.py
          python3 /tmp/policy.py

      - name: Adversarial review policy-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do
            case "$path" in
              .github/AGENTS.md|.github/CLAUDE.md|CONTRIBUTING.md|BACKEND_ARCHITECTURE.md) ;;
              *) echo "Unexpected file changed: $path" >&2; exit 1 ;;
            esac
          done
          for path in .github/AGENTS.md .github/CLAUDE.md CONTRIBUTING.md BACKEND_ARCHITECTURE.md; do
            grep -q 'target branch' "$path"
          done
          git diff --stat
          git diff -- .github/AGENTS.md .github/CLAUDE.md CONTRIBUTING.md BACKEND_ARCHITECTURE.md

      - name: Commit policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/AGENTS.md .github/CLAUDE.md CONTRIBUTING.md BACKEND_ARCHITECTURE.md
          git commit -m 'docs: define target-branch compatibility boundary'
          git push origin HEAD:bugfix/unix-folder-name-space
