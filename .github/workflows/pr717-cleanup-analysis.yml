name: PR 717 cleanup analysis

on:
  push:
    branches:
      - bugfix/unix-folder-name-space

permissions:
  contents: write

jobs:
  remove-ownership-version-compatibility:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove intermediate ownership compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The first cleanup target is expression-bodied, while the shared temporary
          # cleanup helper is intentionally brace-oriented. Remove it exactly and
          # suppress the helper call for this one member.
          payload = Path('listenarr.infrastructure/Library/Moving/LibraryDirectoryOwnershipMarker.Payload.cs')
          text = payload.read_text()
          block = '''    internal static bool MatchesLegacyPayload(
              LibraryDirectoryOwnership ownership,
              MarkerPayload payload) =>
              payload.Version == 1
              && string.Equals(
                  payload.OwnershipToken,
                  ownership.OwnershipToken,
                  StringComparison.Ordinal)
              && MarkerPathMatches(
                  payload.CanonicalPath,
                  ownership.CanonicalPath,
                  ownership.GetIdentity().Semantics);
          '''
          # Normalize indentation from this temporary heredoc before matching source.
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          if block not in text:
              raise SystemExit('missing expression-bodied legacy marker matcher')
          payload.write_text(text.replace(block, '', 1))

          script = Path('.github/scripts/pr717_cleanup_step5.py')
          source = script.read_text()
          call = '''remove_decl(
              "listenarr.infrastructure/Library/Moving/LibraryDirectoryOwnershipMarker.Payload.cs",
              "internal static bool MatchesLegacyPayload(",
          )
          '''
          call = '\n'.join(line[10:] if line.startswith('          ') else line for line in call.splitlines()) + '\n'
          if call not in source:
              raise SystemExit('missing legacy matcher cleanup call')
          script.write_text(source.replace(call, '', 1))
          PY
          python3 .github/scripts/pr717_cleanup_step5.py

      - name: Static adversarial review
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E 'MatchesLegacyPayload|UpgradeLegacyMarkerAsync|TryValidateLegacyMissingBothRecovery|CreateLegacyPending|legacy physical identity|pre-physical-identity|Older builds left these marker' -- \
            listenarr.application listenarr.domain listenarr.infrastructure listenarr.api; then
            echo 'Intermediate ownership compatibility remains in production' >&2
            exit 1
          fi
          if git grep -n -E 'DirectoryObjectIdentityVersion[[:space:]]*==[[:space:]]*1|PayloadVersion[[:space:]]*==[[:space:]]*1' -- \
            listenarr.infrastructure; then
            echo 'Version-one ownership compatibility remains' >&2
            exit 1
          fi
          echo 'Current relocation marker migration callers:'
          git grep -n -E 'PublishMigrationTargetAsync|TryRetireMigrationArtifacts' -- listenarr.infrastructure tests || true
          git diff --stat

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/scripts/pr717_cleanup_step5.py
          dotnet restore listenarr.slnx
          dotnet build listenarr.slnx --configuration Release --no-restore

      - name: Focused ownership and relocation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Listenarr.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~LibraryDirectoryOwnership|FullyQualifiedName~RootFolderRelocation|FullyQualifiedName~AudiobookContentMoveService|FullyQualifiedName~AudiobookFilesystemDeleteService'

      - name: Adversarial live-marker contract review
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E 'PublishMigrationTargetAsync|\.migration\.tmp|TryRetireMigrationArtifacts|RecoverConditionalReplacement' -- listenarr.infrastructure tests || true
          test -f listenarr.infrastructure/Library/Moving/PinnedLibraryDirectoryOwnershipMarker.Migration.cs
          test -f listenarr.infrastructure/Library/Moving/PinnedLibraryDirectoryOwnershipMarker.Recovery.cs
          if ! git grep -q -F 'PublishMigrationTargetAsync' -- listenarr.infrastructure/Library/Moving/RootFolderRelocationService.OwnershipMigration.cs; then
            echo 'Current root-relocation marker migration contract was accidentally removed' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/pr717-cleanup-analysis.yml' ':!.github/scripts/**' ':!.github/pr717-cleanup-trigger'
          git commit -m 'refactor(ownership): remove intermediate protocol compatibility'
          git push origin HEAD:bugfix/unix-folder-name-space
