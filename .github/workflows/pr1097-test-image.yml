name: Publish PR 1097 test image
on:
  push:
    branches: [test/1097-ghcr-ab691bf]
    paths: [.github/workflows/pr1097-test-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab691bfe49b9a81d82fa620ecfd7881713f9d128
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = ab691bfe49b9a81d82fa620ecfd7881713f9d128
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Publish backend and frontend for both architectures
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore listenarr.slnx
          dotnet publish listenarr.api/Listenarr.Api.csproj -c Release -r linux-x64 --no-restore --self-contained false /p:UseAppHost=false -o listenarr.api/docker-publish/amd64
          dotnet publish listenarr.api/Listenarr.Api.csproj -c Release -r linux-arm64 --no-restore --self-contained false /p:UseAppHost=false -o listenarr.api/docker-publish/arm64
          for arch in amd64 arm64; do
            output="listenarr.api/docker-publish/$arch"
            test -s "$output/Listenarr.Api.dll"
            test -s "$output/Listenarr.Infrastructure.dll"
            test -s "$output/wwwroot/index.html"
            test -s "$output/tools/discord-bot/package-lock.json"
            test ! -d "$output/tools/discord-bot/node_modules"
            if find "$output/wwwroot" -type f \( -name '*.map' -o -name stats.html \) | grep -q .; then
              echo 'Unexpected frontend debug output'; exit 1
            fi
            sha256sum "$output/Listenarr.Infrastructure.dll"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish isolated test tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: listenarr.api/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/listenarrs/listenarr:test-pr-1097-ab691bf
          labels: |
            org.opencontainers.image.source=https://github.com/Listenarrs/Listenarr
            org.opencontainers.image.revision=ab691bfe49b9a81d82fa620ecfd7881713f9d128
            org.opencontainers.image.description=PR 1097 rdt-client compatibility test build
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo 'Image: ghcr.io/listenarrs/listenarr:test-pr-1097-ab691bf' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
