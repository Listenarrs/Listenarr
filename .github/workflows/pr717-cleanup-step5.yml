name: PR 717 cleanup step 5

on:
  push:
    branches:
      - bugfix/unix-folder-name-space

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transform
        run: python3 .github/scripts/pr717_cleanup_step5_runner.py
      - name: Static adversarial review
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E 'MatchesLegacyPayload|UpgradeLegacyMarkerAsync|TryValidateLegacyMissingBothRecovery|CreateLegacyPending|legacy physical identity|pre-physical-identity|Older builds left these marker' -- listenarr.application listenarr.domain listenarr.infrastructure listenarr.api; then
            echo 'Intermediate ownership compatibility remains in production' >&2
            exit 1
          fi
          if git grep -n -E 'DirectoryObjectIdentityVersion[[:space:]]*==[[:space:]]*1|PayloadVersion[[:space:]]*==[[:space:]]*1' -- listenarr.infrastructure; then
            echo 'Version-one ownership compatibility remains' >&2
            exit 1
          fi
          git grep -n -E 'PublishMigrationTargetAsync|TryRetireMigrationArtifacts' -- listenarr.infrastructure tests || true
          git diff --stat
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore listenarr.slnx
          dotnet build listenarr.slnx --configuration Release --no-restore
      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Listenarr.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~LibraryDirectoryOwnership|FullyQualifiedName~RootFolderRelocation|FullyQualifiedName~AudiobookContentMoveService|FullyQualifiedName~AudiobookFilesystemDeleteService'
      - name: Live marker adversarial review
        shell: bash
        run: |
          set -euo pipefail
          test -f listenarr.infrastructure/Library/Moving/PinnedLibraryDirectoryOwnershipMarker.Migration.cs
          test -f listenarr.infrastructure/Library/Moving/PinnedLibraryDirectoryOwnershipMarker.Recovery.cs
          git grep -n -E 'PublishMigrationTargetAsync|\.migration\.tmp|TryRetireMigrationArtifacts|RecoverConditionalReplacement' -- listenarr.infrastructure tests || true
          git grep -q -F 'PublishMigrationTargetAsync' -- listenarr.infrastructure/Library/Moving/RootFolderRelocationService.OwnershipMigration.cs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/pr717-cleanup-analysis.yml' ':!.github/workflows/pr717-cleanup-step5.yml' ':!.github/scripts/**' ':!.github/pr717-cleanup-trigger'
          git commit -m 'refactor(ownership): remove intermediate protocol compatibility'
          git push origin HEAD:bugfix/unix-folder-name-space
