name: Canary — build executables & Docker (canary)

concurrency:
  group: canary-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write

on:
  push:
    branches: [ canary ]
  workflow_dispatch:

jobs:
  canary-build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.VERSION }}
      short_sha: ${{ steps.short-sha.outputs.SHORT_SHA }}
      pr_number: ${{ steps.find_triggering_pr.outputs.PR_NUMBER }}
      pr_title: ${{ steps.find_triggering_pr.outputs.PR_TITLE }}
      pr_body_raw: ${{ steps.find_triggering_pr.outputs.PR_BODY_RAW }}
    env:
      API_PROJECT: listenarr.api/Listenarr.Api.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract Pull Request info
        id: find_triggering_pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('PR_NUMBER', '');
              core.setOutput('PR_TITLE', '');
              core.setOutput('PR_BODY_RAW', '');
              core.setOutput('PR_LABELS_JSON', '[]');
              return;
            }

            const { owner, repo } = context.repo;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha
            });

            const pullRequests = associated.data || [];
            const pr = pullRequests.find(item => item.base?.ref === 'canary' && item.merged_at)
              ?? pullRequests.find(item => item.base?.ref === 'canary')
              ?? pullRequests[0];

            if (!pr) {
              core.setOutput('PR_NUMBER', '');
              core.setOutput('PR_TITLE', '');
              core.setOutput('PR_BODY_RAW', '');
              core.setOutput('PR_LABELS_JSON', '[]');
              core.warning(`No pull request was associated with commit ${context.sha}.`);
              return;
            }

            const labels = (pr.labels || [])
              .map(label => typeof label === 'string' ? label : label.name)
              .filter(Boolean);

            core.setOutput('PR_NUMBER', pr.number.toString());
            core.setOutput('PR_TITLE', pr.title || '');
            core.setOutput('PR_BODY_RAW', pr.body || '');
            core.setOutput('PR_LABELS_JSON', JSON.stringify(labels));

      - name: Determine version bump type from PR labels
        id: bump-type
        env:
          PR_LABELS_JSON: ${{ steps.find_triggering_pr.outputs.PR_LABELS_JSON }}
          PR_NUMBER: ${{ steps.find_triggering_pr.outputs.PR_NUMBER }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — no version bump, rebuilding at current version."
            exit 0
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No merged PR was associated with push commit ${GITHUB_SHA}. Use workflow_dispatch to rebuild without a version bump."
            exit 1
          fi

          LABELS="${PR_LABELS_JSON:-[]}"
          echo "PR labels: $LABELS"
          if echo "$LABELS" | jq -e 'contains(["major"])' > /dev/null; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "Bump type: major"
          elif echo "$LABELS" | jq -e 'contains(["minor"])' > /dev/null; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "Bump type: minor"
          elif echo "$LABELS" | jq -e 'contains(["patch"])' > /dev/null; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "Bump type: patch"
          else
            echo "::error::PR #${PR_NUMBER} has no version bump label. Add 'patch', 'minor', or 'major'."
            exit 1
          fi

      - name: Resolve target version
        id: resolve-version
        run: |
          set -euo pipefail
          CSProj=${{ env.API_PROJECT }}

          SOURCE_VERSION=$(sed -n "s:.*<Version>\(.*\)</Version>.*:\1:p" "$CSProj" 2>/dev/null || true)
          if [ -z "${SOURCE_VERSION}" ]; then
            SOURCE_VERSION=$(sed -n "s:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p" "$CSProj" 2>/dev/null || true)
          fi
          if [ -z "${SOURCE_VERSION}" ]; then
            SOURCE_VERSION=$(node -p "require('./fe/package.json').version" 2>/dev/null || echo "0.0.0")
          fi

          echo "Found source version from triggering commit: ${SOURCE_VERSION}"

          BUMP="${{ steps.bump-type.outputs.bump }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${SOURCE_VERSION}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          case "$BUMP" in
            major) TARGET_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) TARGET_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) TARGET_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            none)  TARGET_VERSION="${SOURCE_VERSION}" ;; # manual dispatch — no bump
            *)     echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
          esac

          echo "Bump type: ${BUMP} → Target canary version: ${TARGET_VERSION}"
          echo "SOURCE_VERSION=${SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Inspect current canary version
        id: inspect_target
        run: |
          set -euo pipefail
          git fetch origin canary --depth=1

          BRANCH_XML="$(git show origin/canary:${{ env.API_PROJECT }} 2>/dev/null || true)"
          BRANCH_VERSION=$(printf '%s\n' "$BRANCH_XML" | sed -n "s:.*<Version>\(.*\)</Version>.*:\1:p" | head -n1)
          if [ -z "${BRANCH_VERSION}" ]; then
            BRANCH_VERSION=$(printf '%s\n' "$BRANCH_XML" | sed -n "s:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p" | head -n1)
          fi

          echo "Current canary version: ${BRANCH_VERSION:-<unknown>}"
          echo "BRANCH_VERSION=${BRANCH_VERSION}" >> "$GITHUB_OUTPUT"

          STATE=$(python3 - "${BRANCH_VERSION}" "${{ steps.resolve-version.outputs.VERSION }}" <<'PY'
          import sys

          branch = sys.argv[1].strip()
          target = sys.argv[2].strip()

          def parse(v: str):
              return tuple(int(x) for x in v.split("."))

          if not branch:
              print("pending")
          else:
              b = parse(branch)
              t = parse(target)
              if b == t:
                  print("applied")
              elif b > t:
                  print("superseded")
              else:
                  print("pending")
          PY
          )

          echo "bump_state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "Computed bump state: ${STATE}"

      - name: Abort obsolete run
        if: steps.inspect_target.outputs.bump_state == 'superseded'
        run: |
          echo "::error::Current canary version (${{ steps.inspect_target.outputs.BRANCH_VERSION }}) is newer than target version (${{ steps.resolve-version.outputs.VERSION }}). This run is obsolete and will not publish stale artifacts."
          exit 1

      - name: Persist bumped version to csproj
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.resolve-version.outputs.VERSION != ''
        env:
          NEW_VERSION: ${{ steps.resolve-version.outputs.VERSION }}
        run: |
          set -euo pipefail
          echo "Updating csproj to version $NEW_VERSION"
          cat > update_version.py <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = 'listenarr.api/Listenarr.Api.csproj'
          new = os.environ['NEW_VERSION']
          tree = ET.parse(path)
          root = tree.getroot()

          found_version = False
          for elem in root.findall('.//Version'):
              elem.text = new
              found_version = True
              break
          if not found_version:
              pg = root.find('PropertyGroup')
              if pg is None:
                  pg = ET.SubElement(root, 'PropertyGroup')
              ET.SubElement(pg, 'Version').text = new

          found_assembly = False
          for elem in root.findall('.//AssemblyVersion'):
              elem.text = new
              found_assembly = True
              break
          if not found_assembly:
              pg = root.find('PropertyGroup')
              if pg is None:
                  pg = ET.SubElement(root, 'PropertyGroup')
              ET.SubElement(pg, 'AssemblyVersion').text = new

          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Wrote new version and assembly version to csproj')
          PY
          python3 update_version.py

      - name: Sync frontend and package metadata to bumped version
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.resolve-version.outputs.VERSION != ''
        env:
          NEW_VERSION: ${{ steps.resolve-version.outputs.VERSION }}
        run: node scripts/sync-fe-version-from-csproj.mjs

      - name: Check for tracked version changes
        id: version_changes
        if: steps.inspect_target.outputs.bump_state == 'pending'
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            listenarr.api/Listenarr.Api.csproj \
            package.json \
            package-lock.json \
            fe/package.json \
            fe/package-lock.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No tracked version changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Tracked version changes detected."
          fi

      - name: Create Pull Request for version bump
        id: create_pr
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.version_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "[skip ci] Bump version to ${{ steps.resolve-version.outputs.VERSION }}"
          branch: "ci/canary-version-bump-${{ steps.resolve-version.outputs.VERSION }}"
          base: canary
          delete-branch: true
          title: "Bump version to ${{ steps.resolve-version.outputs.VERSION }}"
          body: |
            This PR bumps the application version to ${{ steps.resolve-version.outputs.VERSION }}.
            The change was produced automatically by the CI canary workflow.

      - name: Ensure version bump PR exists when required
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.create_pr.outputs.pull-request-number == ''
        run: |
          echo "::error::A canary version bump was required, but no pull request was created or found."
          exit 1

      - name: Label version bump PR
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.create_pr.outputs.pull-request-number != ''
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const pr = Number('${{ steps.create_pr.outputs.pull-request-number }}');
            if (!pr) {
              core.info('No PR number returned; skipping labels.');
              return;
            }

            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr,
                  labels: ['automated', 'version-bump']
                });
                core.info(`Applied labels to PR #${pr} on attempt ${attempt}.`);
                return;
              } catch (error) {
                if (attempt === 5) {
                  core.warning(`Failed to label PR #${pr}: ${error.message}`);
                  return;
                }

                const delayMs = attempt * 2000;
                core.warning(`Label attempt ${attempt} failed for PR #${pr}: ${error.message}. Retrying in ${delayMs}ms.`);
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

      - name: Merge version bump PR (skip CI)
        if: steps.inspect_target.outputs.bump_state == 'pending' && steps.create_pr.outputs.pull-request-number != ''
        uses: actions/github-script@v6
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs['pull-request-number'] }}
          NEW_VERSION: ${{ steps.resolve-version.outputs.VERSION }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const pr = parseInt(process.env.PR_NUMBER, 10);
            if (!pr) throw new Error('PR number missing');
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              merge_method: 'merge',
              commit_title: `[skip ci] Merge pull request ${pr} - Bump version to ${process.env.NEW_VERSION}`,
              commit_message: `[skip ci] Merge: Bump version to ${process.env.NEW_VERSION}`
            });

      - name: Refresh workspace to current canary version
        if: steps.inspect_target.outputs.bump_state == 'applied' || steps.create_pr.outputs.pull-request-number != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary
          clean: true

      - name: Verify synced workspace version
        if: steps.inspect_target.outputs.bump_state == 'applied' || steps.create_pr.outputs.pull-request-number != ''
        env:
          NEW_VERSION: ${{ steps.resolve-version.outputs.VERSION }}
        run: |
          set -euo pipefail
          CS_VERSION=$(sed -n "s:.*<Version>\(.*\)</Version>.*:\1:p" "${{ env.API_PROJECT }}" | head -n1)
          FE_VERSION=$(node -p "require('./fe/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          echo "Workspace csproj version: ${CS_VERSION}"
          echo "Workspace FE version: ${FE_VERSION}"
          echo "Workspace root package version: ${ROOT_VERSION}"
          [ "${CS_VERSION}" = "${NEW_VERSION}" ]
          [ "${FE_VERSION}" = "${NEW_VERSION}" ]
          [ "${ROOT_VERSION}" = "${NEW_VERSION}" ]

      - name: Compute short SHA
        id: short-sha
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  canary-publish:
    needs: canary-build
    uses: ./.github/workflows/build-and-publish.yml
    with:
      version: ${{ needs.canary-build.outputs.version }}
      short_sha: ${{ needs.canary-build.outputs.short_sha }}
      channel: canary
      artifact_prefix: canary-artifacts
      include_osx: false
      release_tag: v${{ needs.canary-build.outputs.version }}-canary
      release_name: Canary ${{ needs.canary-build.outputs.version }}
      prerelease: true
      pr_number: ${{ needs.canary-build.outputs.pr_number }}
      pr_title: ${{ needs.canary-build.outputs.pr_title }}
      pr_body_raw: ${{ needs.canary-build.outputs.pr_body_raw }}
      discord_text: A new canary build has been released for docker.
      checkout_ref: canary
      docker_tags: |
        docker.io/therobbiedavis/listenarr:canary
        docker.io/therobbiedavis/listenarr:canary-${{ needs.canary-build.outputs.version }}
        ghcr.io/Thylocine/listenarr:canary
        ghcr.io/Thylocine/listenarr:canary-${{ needs.canary-build.outputs.version }}
        atcr.io/therobbiedavis.com/listenarr:canary
        atcr.io/therobbiedavis.com/listenarr:canary-${{ needs.canary-build.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ATCR_USERNAME: ${{ secrets.ATCR_USERNAME }}
      ATCR_TOKEN: ${{ secrets.ATCR_TOKEN }}
      LISTENARR_DISCORD_WEBHOOK_URL: ${{ secrets.LISTENARR_DISCORD_WEBHOOK_URL }}

      # version bump was pushed via PR+auto-merge above
      # Skipped: separate Web image. The API image contains the frontend in wwwroot.
